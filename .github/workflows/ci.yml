name: Tests and security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt ruff==0.17.1 pip-audit==2.10.1
      - run: python -m pytest -q backend/tests
      - run: ruff check backend configure-docker.py --select F,E9
      - run: pip-audit -r backend/requirements.txt

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build && npm audit
        working-directory: web
      - run: python -m pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEARLY_FRONTEND_PORT: '18080'
      DEARLY_BACKEND_PORT: '18081'
      DEARLY_FRONTEND_LISTEN_PORT: '18082'
      DEARLY_BACKEND_LISTEN_PORT: '18083'
      DEARLY_BACKEND_BIND: 0.0.0.0
      DEARLY_TEST_FRONTEND_URL: http://127.0.0.1:18080
      DEARLY_TEST_BACKEND_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose config --quiet && docker compose build
      - name: Verify separate images, custom ports, browser sessions and live chat
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d
          trap 'docker compose logs; docker compose down' EXIT
          node web/scripts/docker-smoke.mjs
          DEARLY_E2E_BASE_URL="$DEARLY_TEST_FRONTEND_URL" npm --prefix web run test:e2e
          # Retarget the same frontend image to a backend through a host IP/port.
          # No image rebuild: this also exercises Linux host.docker.internal mapping.
          docker compose restart backend
          DEARLY_BACKEND_ADDRESS=host.docker.internal:18081 docker compose up -d --no-build --force-recreate frontend
          node web/scripts/docker-smoke.mjs
          DEARLY_E2E_BASE_URL="$DEARLY_TEST_FRONTEND_URL" npm --prefix web run test:e2e

  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test on an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d["udid"] for runtime, rows in devices.items() if ".iOS-" in runtime
                    for d in rows if d.get("isAvailable") and "iPhone" in d["name"]]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          print(phones[0])')
          xcodebuild -project ios/Dearly.xcodeproj -scheme Dearly -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO test
